          field: stream_order

    legend:
      type: items
      title: Trail Stream Crossings
      items:
        - color: '#08519c'
          label: Permanent watercourse crossing
        - color: '#6baed6'
          label: Intermittent (seasonal) crossing
      description: 123 crossings — potential washout / flood-vulnerability points

    info:
      description: Points where the Oak Ridges Trail crosses a mapped watercourse (123 total, ~1 every 2.2 km), computed by intersecting the trail route with the Ontario Hydro Network (OHN). Most are small headwater streams (67 first-order, 38 second-order); 82 are permanent and 41 intermittent. These are potential washout and flood-vulnerability points for trail infrastructure. Crossings are geometric intersections and do not indicate whether a bridge or culvert is present.

