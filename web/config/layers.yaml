# Williams Treaty Territories - Layer Configuration
# This file defines all map layers and their properties

# Layer activation:
# - active: true  - Layer appears in UI and can be loaded (default)
# - active: false - Layer configuration retained but hidden from UI
#   Use false to temporarily disable layers, keep WIP configs, or maintain
#   seasonal/conditional layers without deleting their configuration

# Layer categories for organizing the UI
categories:
  - id: boundaries
    name: Boundaries
    order: 1

  - id: organizations
    name: Organizations
    order: 2

  - id: communities
    name: Communities
    order: 3

  - id: vegetation
    name: Vegetation
    order: 4

  - id: topography
    name: Topography
    order: 5

  - id: fire
    name: Fire Data
    order: 6

  - id: community_data
    name: Community Data
    order: 7

  - id: health
    name: Public Health
    order: 8

  - id: environmental_justice
    name: Environmental Justice
    order: 9

  - id: biodiversity
    name: Biodiversity
    order: 10

  - id: climate
    name: Climate Risk
    order: 11

  - id: satellite
    name: Satellite Data
    order: 12

# Layer definitions
layers:
  # ============================================================================
  # BOUNDARIES
  # ============================================================================

  - id: treaty
    name: Williams Treaty Territories
    category: boundaries
    type: polygon
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/boundaries/williams_treaty.geojson
    initial_visibility: true
    status: available
    active: true

    style:
      fill:
        color: '#2c5f2d'
        opacity: 0.1
      outline:
        color: '#2c5f2d'
        width: 3
        opacity: 0.8

    popup:
      title_field: ENAME
      title_default: Williams Treaty Territories
      fields:
        - label: Treaty Date
          field: DATE_YEAR
          default: '1923'
        - label: Category
          field: Category
          default: Treaty Land

    info:
      description: Treaty boundaries signed in 1923

  - id: ontario_reserves
    name: Ontario First Nations Reserves
    category: boundaries
    type: polygon
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/boundaries/ontario_reserves.geojson
    initial_visibility: false
    status: available
    active: true
    lazy_load: true

    style:
      fill:
        color: '#fee5d9'
        opacity: 0.2
      outline:
        color: '#fc8d59'
        width: 1
        opacity: 0.5
      before_layer: treaty-fill

    popup:
      title_fields: [adminAreaNameEng]
      fields:
        - label: Reserve Name
          field: adminAreaNameEng
        - label: Reserve ID
          field: adminAreaId
        - label: Type
          field: distributionTypeEng
        - label: Region
          field: adminRegionEng
        - label: Accuracy
          field: absoluteAccuracyEng

    info:
      description: All 203 Indian Reserves in Ontario from Natural Resources Canada

  - id: municipalities
    name: Ontario Municipalities
    category: boundaries
    type: polygon
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/boundaries/ontario_municipalities.geojson
    initial_visibility: false
    status: available
    active: true
    lazy_load: true

    style:
      fill:
        color: '#e0e0e0'
        opacity: 0.1
      outline:
        color: '#999999'
        width: 0.5
        opacity: 0.4

    popup:
      title_fields: [CSDNAME]
      fields:
        - label: Municipality Name
          field: CSDNAME
        - label: Type
          field: CSDTYPE
        - label: Population (2021)
          field: LANDAREA
        - label: Province
          field: PRNAME

    info:
      description: All 577 Census Subdivisions (municipalities) in Ontario from Statistics Canada 2021 Census

  - id: conservation_authorities
    name: Conservation Authorities
    category: boundaries
    type: polygon
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/protected_areas/williams_treaty_conservation_authorities.geojson
    initial_visibility: false
    status: available
    active: true
    lazy_load: true

    style:
      fill:
        color: '#a6cee3'
        opacity: 0.2
      outline:
        color: '#1f78b4'
        width: 1.5
        opacity: 0.6

    popup:
      title_fields: [LEGAL_NAME, COMMON_NAME]
      fields:
        - label: Legal Name
          field: LEGAL_NAME
        - label: Common Name
          field: COMMON_NAME
        - label: Area (sq km)
          field: AREA_IN_SQ_KM
        - label: Type
          field: F_TYPE

    info:
      description: Ontario's 36 Conservation Authorities from Land Information Ontario. Conservation authorities are local watershed management agencies that deliver services and programs to protect and manage natural resources.

  - id: reserves
    name: Williams Treaty Reserves
    category: boundaries
    type: polygon
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/boundaries/williams_treaty_reserves.geojson
    initial_visibility: false
    status: available
    active: true  # Set to false to hide from UI while keeping configuration
    lazy_load: true

    style:
      fill:
        color: '#fc8d59'
        opacity: 0.4
      outline:
        color: '#d73027'
        width: 2
        opacity: 0.8
      before_layer: treaty-fill

    popup:
      title_fields: [adminAreaNameEng]
      fields:
        - label: Reserve Name
          field: adminAreaNameEng
        - label: Reserve ID
          field: adminAreaId
        - label: Type
          field: distributionTypeEng
        - label: Region
          field: adminRegionEng
        - label: Accuracy
          field: absoluteAccuracyEng

    info:
      description: The 10 Indian Reserves of the 7 Williams Treaty First Nations

  - id: provincial_parks
    name: Provincial Parks
    category: boundaries
    type: polygon
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/protected_areas/williams_treaty_provincial_parks.geojson
    initial_visibility: false
    status: available
    active: true
    lazy_load: true

    style:
      fill:
        # Color by park class
        color:
          type: categorical
          field: PROVINCIAL_PARK_CLASS_ENG
          values:
            Wilderness: '#006d2c'           # Dark green - most protected
            Natural Environment: '#31a354'  # Medium green
            Waterway: '#74c476'             # Light green
            Recreation: '#a1d99b'           # Pale green
            Cultural Heritage: '#8c6bb1'    # Purple for cultural sites
          default: '#66c2a4'                # Teal for others
        opacity: 0.4
      outline:
        color: '#238b45'
        width: 2
        opacity: 0.8

    popup:
      title_field: PROTECTED_AREA_NAME_ENG
      fields:
        - label: Short Name
          field: COMMON_SHORT_NAME
        - label: Park Class
          field: PROVINCIAL_PARK_CLASS_ENG
        - label: IUCN Category
          field: IUCN_CATEGORY
        - label: Area (ha)
          field: REGULATED_AREA
          format: '{value:,.0f} ha'
        - label: Established
          field: PROTDATE
        - label: Status
          field: STATUS_ENG
        - label: Management
          field: MANAGEMENT_ENG
        - label: Website
          field: URL
          type: link

    legend:
      type: items
      title: Provincial Parks
      items:
        - color: rgba(0, 109, 44, 0.4)
          border: 2px solid #238b45
          label: Wilderness
        - color: rgba(49, 163, 84, 0.4)
          border: 2px solid #238b45
          label: Natural Environment
        - color: rgba(116, 196, 118, 0.4)
          border: 2px solid #238b45
          label: Waterway
        - color: rgba(161, 217, 155, 0.4)
          border: 2px solid #238b45
          label: Recreation
        - color: rgba(140, 107, 177, 0.4)
          border: 2px solid #238b45
          label: Cultural Heritage
      description: Parks classified by primary purpose

    info:
      description: Ontario Provincial Parks classified by conservation and recreation purpose

  - id: wetlands
    name: Wetlands
    category: boundaries
    type: polygon
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/hydrology/williams_treaty_wetlands.geojson
    initial_visibility: false
    status: available
    active: true
    lazy_load: true

    style:
      fill:
        color: '#74add1'
        opacity: 0.5
      outline:
        color: '#4575b4'
        width: 1
        opacity: 0.7

    popup:
      title_field: WETLAND_TY
      title_default: Wetland
      fields:
        - label: Wetland Type
          field: WETLAND_TY
        - label: Class
          field: CLASS
          optional: true
        - label: Area (ha)
          field: AREA_HA
          format: '{value:,.2f} ha'
          optional: true

    info:
      description: 892 wetland areas in Williams Treaty territory

  - id: watersheds
    name: Watersheds
    category: boundaries
    type: polygon
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/hydrology/williams_treaty_watersheds.geojson
    initial_visibility: false
    status: available
    active: true
    lazy_load: true

    style:
      fill:
        color: '#4292c6'
        opacity: 0.15
      outline:
        color: '#08519c'
        width: 1.5
        opacity: 0.6

    popup:
      title_fields: [NAME1, NAME2]
      title_default: Watershed
      fields:
        - label: Primary Watershed
          field: NAME1
        - label: Secondary Watershed
          field: NAME2
        - label: Tertiary Watershed
          field: NAME3
          optional: true
        - label: Quaternary Watershed
          field: NAME4
          optional: true
        - label: Area (hectares)
          field: AREA_HA
          format: '{value:,.2f} ha'
        - label: Area (acres)
          field: AREA_ACRE
          format: '{value:,.2f} acres'
        - label: Watershed Code
          field: CODE6
        - label: Data Source
          field: SOURCE

    legend:
      type: items
      title: Watersheds
      items:
        - color: rgba(66, 146, 198, 0.15)
          border: 1.5px solid #08519c
          label: Watershed boundary
      description: Hierarchical watershed drainage areas

    info:
      description: Ontario watersheds showing hierarchical drainage basins from primary to quaternary levels

  - id: greenbelt
    name: Ontario Greenbelt Boundary
    category: boundaries
    type: polygon
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/environmental/greenbelt_boundary.geojson
    initial_visibility: false
    status: available
    active: true
    lazy_load: true

    style:
      fill:
        color: '#228B22'
        opacity: 0.2
      outline:
        color: '#006400'
        width: 2.5
        opacity: 0.9

    popup:
      title_default: Ontario Greenbelt
      fields:
        - label: Designation
          field: designation
        - label: Area (hectares)
          field: hectares
          format: '{value:,.0f}'

    legend:
      type: items
      title: Greenbelt
      items:
        - color: rgba(34, 139, 34, 0.2)
          border: 2.5px solid #006400
          label: Greenbelt boundary
      description: Protected green space surrounding Greater Golden Horseshoe (857,000 ha)

    info:
      description: Ontario Greenbelt outer boundary - a protected area of green space, farmland, forests, wetlands, and watersheds surrounding the Greater Golden Horseshoe. Established in 2005 under the Greenbelt Act. Covers approximately 857,000 hectares.

  - id: greenbelt_designation
    name: Greenbelt Land Use Designations
    category: boundaries
    type: polygon
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/environmental/greenbelt_designation.geojson
    initial_visibility: false
    status: available
    active: true
    lazy_load: true

    style:
      fill:
        color:
          property: designation
          type: categorical
          values:
            Protected Countryside: '#228B22'
            Urban River Valley: '#4169E1'
            Niagara Escarpment Plan: '#8B4513'
            Oak Ridges Moraine Conservation Plan: '#8B7355'
          default: '#228B22'
        opacity: 0.4
      outline:
        color: '#006400'
        width: 1
        opacity: 0.7

    popup:
      title_field: designation
      fields:
        - label: Designation
          field: designation
        - label: Area (hectares)
          field: hectares
          format: '{value:,.1f}'
        - label: Parent Area
          field: parent_area

    legend:
      type: items
      title: Greenbelt Designations
      items:
        - color: rgba(34, 139, 34, 0.4)
          border: 1px solid #006400
          label: Protected Countryside
        - color: rgba(65, 105, 225, 0.4)
          border: 1px solid #006400
          label: Urban River Valley
        - color: rgba(139, 69, 19, 0.4)
          border: 1px solid #006400
          label: Niagara Escarpment Plan
        - color: rgba(139, 115, 85, 0.4)
          border: 1px solid #006400
          label: Oak Ridges Moraine Plan
      description: Land use designations within the Ontario Greenbelt

    info:
      description: Land use designations within the Ontario Greenbelt. Protected Countryside includes agricultural and rural lands. Urban River Valleys are protected river corridors in urban areas. Areas may also fall under the Niagara Escarpment Plan or Oak Ridges Moraine Conservation Plan.

  - id: oak_ridges_moraine
    name: Oak Ridges Moraine Boundary
    category: boundaries
    type: polygon
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/environmental/oak_ridges_moraine_boundary.geojson
    initial_visibility: false
    status: available
    active: true
    lazy_load: true

    style:
      fill:
        color: '#8B7355'
        opacity: 0.25
      outline:
        color: '#5D4E37'
        width: 2.5
        opacity: 0.9

    popup:
      title_default: Oak Ridges Moraine
      fields:
        - label: Designation
          field: designation
        - label: Area (hectares)
          field: hectares
          format: '{value:,.0f}'

    legend:
      type: items
      title: Oak Ridges Moraine
      items:
        - color: rgba(139, 115, 85, 0.25)
          border: 2.5px solid #5D4E37
          label: Moraine planning area
      description: Protected geological landform in southern Ontario

    info:
      description: Oak Ridges Moraine Planning Area - a protected geological landform stretching 160 km from the Trent River to the Niagara Escarpment. Established under provincial legislation in October 2001, the moraine is a critical groundwater recharge area and ecological corridor.

  - id: oak_ridges_moraine_land_use
    name: Oak Ridges Moraine Land Use
    category: boundaries
    type: polygon
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/environmental/oak_ridges_moraine_land_use.geojson
    initial_visibility: false
    status: available
    active: true
    lazy_load: true

    style:
      fill:
        color:
          property: designation
          type: categorical
          values:
            Natural Core Area: '#1a5e1a'
            Natural Linkage Area: '#4d9d4d'
            Countryside Area: '#c4a35a'
            Settlement Area: '#d9534f'
            Rural Settlement: '#f0ad4e'
            Palgrave Estates Residential Community: '#999999'
          default: '#A0826D'
        opacity: 0.45
      outline:
        color: '#5D4E37'
        width: 1
        opacity: 0.7

    popup:
      title_field: designation
      fields:
        - label: Designation
          field: designation
        - label: Area (hectares)
          field: hectares
          format: '{value:,.1f}'
        - label: Parent Area
          field: parent_area

    legend:
      type: items
      title: ORM Land Use Designations
      items:
        - color: rgba(26, 94, 26, 0.45)
          border: 1px solid #5D4E37
          label: Natural Core Area
        - color: rgba(77, 157, 77, 0.45)
          border: 1px solid #5D4E37
          label: Natural Linkage Area
        - color: rgba(196, 163, 90, 0.45)
          border: 1px solid #5D4E37
          label: Countryside Area
        - color: rgba(217, 83, 79, 0.45)
          border: 1px solid #5D4E37
          label: Settlement Area
        - color: rgba(240, 173, 78, 0.45)
          border: 1px solid #5D4E37
          label: Rural Settlement
      description: Land use designations under the Oak Ridges Moraine Conservation Plan

    info:
      description: Land use designations under the Oak Ridges Moraine Conservation Plan. Natural Core Areas have the highest protection, Natural Linkage Areas maintain ecological corridors, Countryside Areas permit agricultural/rural uses, and Settlement Areas are existing urban zones. Digitized at 1:10,000 scale.

  - id: oak_ridges_trail
    name: Oak Ridges Trail
    category: boundaries
    type: line
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/environmental/oak_ridges_trail.geojson
    initial_visibility: false
    status: available
    active: true
    lazy_load: true

    style:
      line:
        color: '#d94801'
        width: 2.5
        opacity: 0.9

    popup:
      title_field: name
      title_default: Oak Ridges Trail
      fields:
        - label: Section
          field: name

    legend:
      type: items
      title: Oak Ridges Trail
      items:
        - color: '#d94801'
          label: Trail route
      description: Main hiking route along the Oak Ridges Moraine

    info:
      description: The Oak Ridges Trail is a long-distance hiking route following the Oak Ridges Moraine across south-central Ontario. Maintained by the Oak Ridges Trail Association, it connects natural areas along the moraine within the Williams Treaty territory.

  - id: ohn_waterbodies
    name: Lakes & Waterbodies
    category: boundaries
    type: polygon
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/hydrology/ohn_waterbodies.geojson
    initial_visibility: false
    status: available
    active: true
    lazy_load: true

    style:
      fill:
        color: '#a8cfe8'
        opacity: 0.6
      outline:
        color: '#4a90d9'
        width: 0.5
        opacity: 0.8

    popup:
      title_field: name
      title_default: Waterbody
      fields:
        - label: Name
          field: name
        - label: Type
          field: WATERBODY_TYPE
        - label: Permanency
          field: PERMANENCY

    legend:
      type: items
      title: Lakes & Waterbodies
      items:
        - color: rgba(168, 207, 232, 0.6)
          border: 0.5px solid #4a90d9
          label: Lake / pond / wide river
      description: Ontario Hydro Network waterbodies in the trail corridor

    info:
      description: Lakes, ponds, reservoirs, and wide rivers (mapped as polygons) from the Ontario Hydro Network (OHN), Land Information Ontario. Rivers wide enough to be mapped as areas appear here rather than in the Streams & Rivers line layer.

  - id: ohn_streams
    name: Streams & Rivers
    category: boundaries
    type: line
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/hydrology/ohn_streams.geojson
    initial_visibility: false
    status: available
    active: true
    lazy_load: true

    style:
      line:
        # Line color by permanency (permanent vs seasonal/intermittent)
        color:
          type: categorical
          field: PERMANENCY
          values:
            Permanent: '#2b6cb0'
            Intermittent: '#8bb8dc'
          default: '#4a90d9'
        # Line width scales with Strahler stream order (headwater rill -> river)
        width:
          type: interpolate
          field: STREAM_ORDER
          stops:
            - [1, 0.4]
            - [2, 0.8]
            - [3, 1.4]
            - [4, 2.2]
            - [5, 3.2]
            - [7, 5.0]
            - [9, 7.0]
        opacity: 0.8

    popup:
      title_field: name
      title_default: Watercourse
      fields:
        - label: Name
          field: name
        - label: Type
          field: WATERCOURSE_TYPE
        - label: Permanency
          field: PERMANENCY
        - label: Stream Order (Strahler)
          field: STREAM_ORDER

    legend:
      type: items
      title: Streams & Rivers
      items:
        - color: '#2b6cb0'
          label: Permanent watercourse
        - color: '#8bb8dc'
          label: Intermittent (seasonal)
      description: Line width scales with stream order (thicker = larger). Ontario Hydro Network.

    info:
      description: Stream and river network from the Ontario Hydro Network (OHN), Land Information Ontario — the authoritative provincial hydrography. Line colour distinguishes permanent from intermittent (seasonal) watercourses; line width scales with Strahler stream order, so small headwater channels render thin and larger downstream rivers render thick. Stream order is computed on the trail-corridor network and is relative within that extent.

  # ============================================================================
  # ORGANIZATIONS
  # ============================================================================

  - id: charities
    name: Ontario Registered Charities
    category: organizations
    type: point
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/organizations/environmental_organizations.geojson
    initial_visibility: false
    status: available
    active: true  # Now available in S3

    style:
      circle:
        radius: 6
        color: '#3887be'
        opacity: 0.8
        stroke_width: 2
        stroke_color: '#ffffff'

    popup:
      title_field: name
      fields:
        - label: Location
          format: '{city}, {province}'
        - label: Category
          field: category
        - label: Revenue
          field: revenue
          format: '${value:,.0f}'
        - label: Programs
          field: programs
          truncate: 100
        - label: Website
          field: website
          type: link

    info:
      description: 186 Ontario registered charities filtered to focus on Indigenous or environmental topics within Williams Treaty territory.

  # ============================================================================
  # COMMUNITIES
  # ============================================================================

  - id: communities
    name: Williams Treaty First Nations
    category: communities
    type: point
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/boundaries/williams_treaty_communities.geojson
    initial_visibility: false
    status: available

    style:
      circle:
        radius: 8
        color: '#d73027'
        opacity: 0.9
        stroke_width: 2
        stroke_color: '#ffffff'

    popup:
      title_field: name
      fields:
        - label: Reserve
          field: reserve_name
        - label: Population
          field: population
          format: '~{value:,.0f}'
        - label: Treaty
          field: treaty

    info:
      description: 7 First Nations communities (~9,000 people)

  - id: infrastructure
    name: Infrastructure Projects
    category: community_data
    type: point
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/community/williams_treaty_infrastructure_projects.geojson
    initial_visibility: false
    status: available
    active: true
    lazy_load: true

    style:
      circle:
        radius: 5
        opacity: 0.8
        stroke_width: 1
        stroke_color: '#ffffff'
        # Data-driven styling
        color:
          type: categorical
          field: category
          values:
            Housing: '#e41a1c'
            'Water and Wastewater': '#377eb8'
            'Solid Waste Management': '#4daf4a'
            'Fire Protection': '#ff7f00'
            Health: '#984ea3'
          default: '#999999'

    popup:
      title_fields: [project_name]
      title_default: Infrastructure Project
      fields:
        - label: Community
          field: community
        - label: Category
          field: category
        - label: Status
          field: status
        - label: Description
          field: description
          truncate: 200
        - label: Investment
          field: investment
          hide_if: Not Available

    info:
      description: 445 federal infrastructure projects in Williams Treaty territory

  - id: water_advisories
    name: Water Advisories
    category: community_data
    type: point
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/community/williams_treaty_water_advisories.geojson
    initial_visibility: false
    status: available
    active: true
    lazy_load: true

    # Per-layer data source configuration
    data_source:
      source_info:
        provider: "Indigenous Services Canada"
        dataset: "Drinking Water Advisories"
        date: "2025-11-24"
        license: "Open Government License - Canada"
        license_url: "https://open.canada.ca/en/open-government-licence-canada"
        update_frequency: "Weekly"

    style:
      circle:
        radius: 7
        opacity: 0.9
        stroke_width: 2
        stroke_color: '#ffffff'
        # Data-driven styling
        color:
          type: conditional
          field: is_active
          conditions:
            - when: true
              value: '#d73027'  # Red for active
            - when: false
              value: '#91cf60'  # Green for lifted

    popup:
      title_fields: [water_system]
      title_default: Water System
      fields:
        - label: First Nation
          field: first_nation
        - label: Status
          field: is_active
          format_active: '<span style="color:#d73027;font-weight:bold">ACTIVE</span>'
          format_inactive: '<span style="color:#91cf60;font-weight:bold">Lifted</span>'
        - label: Type
          field: advisory_type
        - label: Date Set
          field: date_set
        - label: Date Lifted
          field: date_lifted
          optional: true
