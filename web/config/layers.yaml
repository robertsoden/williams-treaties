  - id: trail_stream_crossings
    name: Trail Stream Crossings
    category: climate
    type: point
    data_url: https://ontario-environmental-data.s3.us-east-1.amazonaws.com/datasets/hydrology/oak_ridges_trail_stream_crossings.geojson
