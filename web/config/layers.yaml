        # Colour by permanency: permanent crossings are higher-consequence
        color:
          type: categorical
          field: permanency
          values:
            Permanent: '#08519c'
            Intermittent: '#6baed6'
          default: '#1f78b4'

    popup:
      title_field: stream_name
      title_default: Stream Crossing
      fields:
